{% extends "base.html" %}{% block title %}First-Time Setup{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:2rem;">
<div class="card slide-up" style="max-width:460px;width:100%;">
  <div style="text-align:center;margin-bottom:1.75rem;">
    <div style="width:60px;height:60px;background:rgba(108,99,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;color:#a78bfa;"><i class="fas fa-shield-alt"></i></div>
    <h2>Create Admin Account</h2>
    <p style="color:var(--muted);font-size:0.88rem;margin-top:0.4rem;">This page only appears once. Set up your admin credentials securely.</p>
  </div>
  <div style="background:rgba(108,99,255,0.08);border:1px solid rgba(108,99,255,0.2);border-radius:10px;padding:0.875rem 1rem;margin-bottom:1.5rem;font-size:0.82rem;color:#a78bfa;">
    <i class="fas fa-info-circle"></i> This setup page will disappear permanently after you create the admin account.
  </div>
  <form method="POST">
    <div class="form-group"><label>Admin Name</label><input type="text" name="name" class="form-control" placeholder="e.g. Platform Administrator" required></div>
    <div class="form-group"><label>Admin Email</label><input type="email" name="email" class="form-control" placeholder="admin@yourdomain.com" required></div>
    <div class="form-group"><label>Secure Password</label><input type="password" name="password" class="form-control" placeholder="Use a strong password" required minlength="8"></div>
    <button type="submit" class="btn btn-violet btn-lg" style="width:100%;justify-content:center;"><i class="fas fa-user-shield"></i> Create Admin Account</button>
  </form>
</div>
</div>{% endblock %}
