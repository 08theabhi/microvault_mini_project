{% extends "base.html" %}{% block title %}Reset Password{% endblock %}
{% block extra_head %}
<style>
.auth-scene{min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:2rem;}
.auth-card{background:#ffffff;border:1px solid rgba(0,0,0,0.1);border-radius:20px;padding:2.75rem;box-shadow:0 32px 80px rgba(0,0,0,0.1);width:100%;max-width:420px;position:relative;}
.auth-card::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,#c47a1a,transparent);}
.otp-row{display:flex;gap:0.6rem;justify-content:center;margin:1.25rem 0 1.75rem;}
.otp-digit{width:48px;height:56px;background:#f0f0f0;border:1.5px solid rgba(0,0,0,0.15);border-radius:12px;text-align:center;font-size:1.4rem;font-weight:800;font-family:'Fraunces',serif;color:#1a1a1a;caret-color:#c47a1a;transition:border-color 0.2s,box-shadow 0.2s,transform 0.15s;outline:none;}
.otp-digit:focus{border-color:#c47a1a;box-shadow:0 0 0 3px rgba(240,164,48,0.25);transform:translateY(-2px);}
.otp-digit.filled{border-color:rgba(240,164,48,0.4);background:#f9f9f9;}
</style>
{% endblock %}
{% block content %}
<div class="auth-scene">
<div class="reveal" style="width:100%;max-width:420px;">
<div class="auth-card">
  <div style="text-align:center;margin-bottom:1.5rem;">
    <div style="width:56px;height:56px;background:rgba(240,164,48,0.08);border:1px solid rgba(240,164,48,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.3rem;">🔐</div>
    <h2 style="font-family:'Fraunces',serif;font-size:1.35rem;font-weight:700;margin-bottom:0.3rem;color:#1a1a1a;">Reset Password</h2>
    {% if email %}<p style="color:rgba(0,0,0,0.45);font-size:0.85rem;">Code sent to <strong style="color:#1a1a1a;">{{ email }}</strong></p>{% endif %}
  </div>
  <form method="POST" id="resetForm">
    <input type="hidden" name="otp" id="otpHidden">
    <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(0,0,0,0.45);margin-bottom:0.5rem;">Verification Code</div>
    <div class="otp-row">{% for i in range(6) %}<input class="otp-digit" type="text" maxlength="1" inputmode="numeric" id="d{{ i }}">{% endfor %}</div>
    <div class="form-group"><label>New Password</label>
      <div class="input-wrap" style="position:relative;"><i class="fas fa-lock input-icon"></i><input type="password" name="new_password" id="resetPwInput" class="form-control" placeholder="Min. 6 characters" required minlength="6" style="padding-right:2.75rem;">
      <button type="button" onclick="toggleResetPw()"
        style="position:absolute;right:0.875rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(0,0,0,0.45);font-size:0.9rem;padding:0;transition:color 0.2s;">
        <i class="fas fa-eye" id="resetEyeIcon"></i>
      </button></div>
    </div>
    <button type="submit" class="btn btn-amber" style="width:100%;justify-content:center;padding:0.8rem;"><i class="fas fa-check"></i> Reset Password</button>
  </form>
  <div style="text-align:center;margin-top:1.25rem;"><a href="/forgot-password" style="font-size:0.82rem;color:rgba(0,0,0,0.45);"><i class="fas fa-arrow-left"></i> Request a new code</a></div>
</div></div></div>
<script>
const digits=[...document.querySelectorAll('.otp-digit')],hidden=document.getElementById('otpHidden');
function sync(){hidden.value=digits.map(d=>d.value).join('');}
digits.forEach((d,i)=>{
  d.addEventListener('input',()=>{d.value=d.value.replace(/\D/g,'');d.classList.toggle('filled',!!d.value);if(d.value&&i<5)digits[i+1].focus();sync();});
  d.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!d.value&&i>0){digits[i-1].value='';digits[i-1].classList.remove('filled');digits[i-1].focus();sync();}});
  d.addEventListener('paste',e=>{e.preventDefault();const p=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');[...p.slice(0,6)].forEach((c,j)=>{if(digits[i+j]){digits[i+j].value=c;digits[i+j].classList.add('filled');}});sync();});
});
digits[0].focus();

function toggleResetPw() {
  const input = document.getElementById('resetPwInput');
  const icon  = document.getElementById('resetEyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fas fa-eye-slash';
    icon.parentElement.style.color = '#c47a1a';
  } else {
    input.type = 'password';
    icon.className = 'fas fa-eye';
    icon.parentElement.style.color = 'rgba(0,0,0,0.45)';
  }
}
</script>
{% endblock %}
