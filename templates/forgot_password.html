{% extends "base.html" %}{% block title %}Forgot Password{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:2rem;">
<div class="card slide-up" style="max-width:420px;width:100%;">
  <div style="text-align:center;margin-bottom:1.75rem;">
    <div style="width:60px;height:60px;background:rgba(108,99,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;color:#a78bfa;"><i class="fas fa-key"></i></div>
    <h2 style="font-size:1.4rem;">Forgot Password?</h2>
    <p style="color:var(--muted);font-size:0.88rem;margin-top:0.4rem;">Enter your email and we'll generate a reset token.</p>
  </div>
  <form method="POST">
    <div class="form-group"><label>Email Address</label><input type="email" name="email" class="form-control" placeholder="you@example.com" required></div>
    <button type="submit" class="btn btn-violet" style="width:100%;justify-content:center;padding:0.75rem;"><i class="fas fa-paper-plane"></i> Get Reset Token</button>
  </form>
  <div style="text-align:center;margin-top:1.25rem;"><a href="/login" style="color:var(--muted);font-size:0.85rem;"><i class="fas fa-arrow-left"></i> Back to Login</a></div>
</div>
</div>{% endblock %}
